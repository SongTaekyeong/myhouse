# 로컬 개발 & 파이프라인 스택 (SPEC.md §3, §12)
# - postgres: 앱 DB. staging/intermediate/mart 전부 여기 산다 (PostGIS)
# - airflow-*: LocalExecutor, 메타DB는 앱 DB와 분리된 별도 postgres 컨테이너
#
# 사용법:
#   cp .env.local.example .env.local   # 값 채우기
#   docker compose --env-file .env.local up -d

name: naejip

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: naejip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-naejip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}
      POSTGRES_DB: ${POSTGRES_DB:-naejip}
    ports:
      # 5433: 이 컴퓨터에 이미 네이티브 postgres가 5432를 쓰고 있어서 충돌 회피
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naejip}"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-postgres:
    image: postgres:16
    container_name: naejip-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env.local}
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: naejip-airflow:2.9.3
    container_name: naejip-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      # pipeline/ingest/*.py 가 컨테이너 안에서는 postgres 서비스명 + 내부 포트로 접속하도록
      # (.env.local의 5433은 호스트 전용 매핑 포트라 컨테이너 내부에서는 안 맞음)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DBT_PROFILES_DIR: /opt/airflow/dbt_profiles
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./dbt:/opt/airflow/dbt
      - ./airflow/dbt_profiles.yml:/opt/airflow/dbt_profiles/profiles.yml:ro
      - ./config:/opt/airflow/config:ro
      - ./.env.local:/opt/airflow/.env.local:ro
      - airflow_logs:/opt/airflow/logs
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname admin --lastname admin \
          --role Admin --email admin@example.com || true

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: naejip-airflow:2.9.3
    container_name: naejip-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    ports:
      - "8081:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./dbt:/opt/airflow/dbt
      - ./airflow/dbt_profiles.yml:/opt/airflow/dbt_profiles/profiles.yml:ro
      - ./config:/opt/airflow/config:ro
      - ./.env.local:/opt/airflow/.env.local:ro
      - airflow_logs:/opt/airflow/logs
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: naejip-airflow:2.9.3
    container_name: naejip-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./dbt:/opt/airflow/dbt
      - ./airflow/dbt_profiles.yml:/opt/airflow/dbt_profiles/profiles.yml:ro
      - ./config:/opt/airflow/config:ro
      - ./.env.local:/opt/airflow/.env.local:ro
      - airflow_logs:/opt/airflow/logs
    command: scheduler

volumes:
  pg_data:
  airflow_pg_data:
  airflow_logs:
