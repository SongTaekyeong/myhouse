# 운영 스택 (SPEC.md §11). 로컬의 docker-compose.yml과 다른 점:
#   - Airflow/dbt가 없다. 파이프라인은 로컬 PC에서만 돌고, mart_*만
#     pipeline/scripts/sync_mart.sh로 이 postgres에 밀어넣는다.
#   - backend/frontend는 호스트 포트를 열지 않는다 - caddy만 80/443을 열고,
#     나머지는 전부 도커 내부망(naejip-net)으로만 통신한다.
#   - postgres는 로컬호스트(VM 자기 자신)로만 열어둔다. sync_mart.sh를 로컬 PC에서
#     돌리려면 `ssh -L 5432:localhost:5432 <vm>` 터널을 먼저 띄울 것.
#
# 사용법 (VM에서):
#   cp .env.prod.example .env.prod   # 값 채우기
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

name: naejip-prod

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: naejip-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-naejip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-naejip}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naejip}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [naejip-net]

  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE in .env.prod}
    container_name: naejip-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      AUTH_DISABLED: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-naejip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-naejip}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?set ALLOWED_EMAILS in .env.prod}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?set INTERNAL_API_SECRET in .env.prod}
      CORS_ORIGINS: https://${DOMAIN:?set DOMAIN in .env.prod}
    networks: [naejip-net]

  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE in .env.prod}
    container_name: naejip-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env.prod}
      AUTH_URL: https://${DOMAIN}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?set AUTH_GOOGLE_ID in .env.prod}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?set AUTH_GOOGLE_SECRET in .env.prod}
    networks: [naejip-net]

  caddy:
    image: caddy:2-alpine
    container_name: naejip-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [naejip-net]

networks:
  naejip-net:

volumes:
  pg_data_prod:
  caddy_data:
  caddy_config:
