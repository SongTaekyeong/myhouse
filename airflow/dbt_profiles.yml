# Airflow 컨테이너 전용 profiles.yml.
# dbt/ 프로젝트 폴더 안에 두면 로컬 실행 시에도 ~/.dbt/profiles.yml보다 먼저 읽혀버려서
# (dbt가 프로젝트 폴더 내 profiles.yml을 최우선으로 찾음) 일부러 dbt/ 밖(여기)에 둠.
# DBT_PROFILES_DIR=/opt/airflow/dbt_profiles 로 컨테이너 안에서만 이 파일을 보게 함.
# 호스트에서 직접 dbt 돌릴 땐 여전히 ~/.dbt/profiles.yml (포트 5433) 를 씀 - 이건 컨테이너 내부망 포트(5432).
naejip:
  target: dev
  outputs:
    dev:
      type: postgres
      host: postgres
      port: 5432
      user: naejip
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: naejip
      schema: public
      threads: 4
