# main 브랜치 푸시 -> backend/frontend 이미지 빌드 & GHCR에 push -> VM에서 pull & up.
# 필요한 GitHub Secrets (repo Settings > Secrets and variables > Actions):
#   NEXT_PUBLIC_KAKAO_JS_KEY  - 프론트 빌드에 박아 넣을 카카오맵 JS 키
#   SSH_HOST                 - VM 공인 IP 또는 도메인
#   SSH_USER                 - VM 접속 계정
#   SSH_PRIVATE_KEY          - 그 계정의 배포 전용 SSH 개인키
#   DEPLOY_PATH              - VM에서 이 저장소를 clone해둔 절대경로 (예: /home/ubuntu/naejip)
name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_base: ${{ steps.vars.outputs.image_base }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "image_base=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.vars.outputs.image_base }}/naejip-backend:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_KAKAO_JS_KEY=${{ secrets.NEXT_PUBLIC_KAKAO_JS_KEY }}
          tags: ${{ steps.vars.outputs.image_base }}/naejip-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
            docker image prune -f
